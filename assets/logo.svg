<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c6ff5" />
      <stop offset="100%" stop-color="#1852de" />
    </linearGradient>
  </defs>

  <!-- Blue Squircle Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#blueGrad)" />

  <!-- 2x2 OMR Bubbles Grid -->
  <!-- Top Left: Solid White Circle -->
  <circle cx="180" cy="180" r="54" fill="#ffffff" />

  <!-- Top Right: White Stroked Circle (Hollow) -->
  <circle cx="332" cy="180" r="46.5" fill="none" stroke="#ffffff" stroke-width="15" />

  <!-- Bottom Left: White Stroked Circle (Hollow) -->
  <circle cx="180" cy="332" r="46.5" fill="none" stroke="#ffffff" stroke-width="15" />

  <!-- Bottom Right: Solid White Circle -->
  <circle cx="332" cy="332" r="54" fill="#ffffff" />
</svg>
